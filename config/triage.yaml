# Правила сервиса. Для другого проекта меняются файлы config/, код остаётся тем же.
categories: [billing, support, complaint, other]
confidences: [high, medium, low]
max_reply_sentences: 6
model_timeout_seconds: 25
fallback_reply: "Ваше обращение принято и передано оператору. Мы свяжемся с вами в ближайшее время."
fallback_category: other
# Когда обязательно нужен человек. Сбой модели эскалирует всегда (см. fallback_*).
escalate_if:
  categories: [complaint]
  confidences: [low]
# Защита от манипуляций: попытки переписать инструкции, выманить промпт или данные других клиентов.
# Совпадение (без учёта регистра) -> модель не вызываем, ответ-заглушка и эскалация.
# Список ловит только известные формулировки; остальное остаётся на промпте.
injection_patterns:
  - 'забудь\w*\s+(все\s+|всё\s+)?(свои\s+|ваш\w*\s+|твои\s+|прошл\w+\s+|предыдущ\w+\s+|эти\s+)?(правил|инструкц)'
  - 'игнорир\w+\s+(все\s+|всё\s+)?(свои\s+|ваш\w*\s+|твои\s+|прошл\w+\s+|предыдущ\w+\s+|эти\s+|выше\w*\s+)?(правил|инструкц)'
  - 'системн\w+\s+(промпт|инструкц|сообщен)'
  - '(покажи|выведи|раскрой|напиши|пришли)\w*\s+(мне\s+)?(свой\s+|твой\s+|весь\s+)?(промпт|инструкц)'
  - 'ignore\s+(all\s+)?(the\s+)?(previous|prior|above)\s+(instructions|rules)'
  - 'system\s+prompt'
  - 'jailbreak'
  - 'режим\s+разработчика|developer\s+mode'
  - '(других|чужих)\s+(клиентов|учеников|студентов|пользователей)'  # просьба выдать данные третьих лиц
